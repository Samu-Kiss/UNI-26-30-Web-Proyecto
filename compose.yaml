services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env.local
        format: raw
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
      args:
        MYT_BACKEND_URL: http://localhost:8080
    ports:
      - "4200:80"
    depends_on:
      - backend
