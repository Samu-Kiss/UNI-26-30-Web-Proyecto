<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor contenedor-formulario">
        <a class="volver" th:href="@{/usuarios}">Volver a usuarios</a>
        <section class="tarjeta formulario-tarjeta">
            <p class="marca">MyT</p>
            <h1>Nuevo usuario</h1>
            <p class="descripcion">Los campos marcados con * son obligatorios.</p>

            <form class="formulario" th:action="@{/usuarios/registrar}" th:object="${usuario}" method="post">
                <div class="rejilla">
                    <label>
                        Nombre *
                        <input type="text" th:field="*{nombre}" maxlength="100" required>
                        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </label>
                    <label>
                        Apellido *
                        <input type="text" th:field="*{apellido}" maxlength="100" required>
                        <span class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                    </label>
                </div>

                <label>
                    Correo *
                    <input type="email" th:field="*{correo}" maxlength="120" required>
                    <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
                </label>

                <label>
                    Contraseña *
                    <input type="password" th:field="*{contrasena}" maxlength="72"
                           required autocomplete="new-password">
                    <span class="error" th:if="${#fields.hasErrors('contrasena')}"
                          th:errors="*{contrasena}"></span>
                </label>

                <label>
                    Telefono
                    <input type="tel" th:field="*{telefono}" maxlength="30">
                    <span class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
                </label>

                <section class="seccion-perfil">
                    <h2>Tipo de cuenta</h2>
                    <p class="descripcion">Este perfil determina la página que verá al iniciar sesión.</p>
                    <div class="alerta-error" role="alert" th:if="${errorPerfil}" th:text="${errorPerfil}"></div>

                    <label>
                        Perfil *
                        <select id="rol" name="rol" required>
                            <option value="">Selecciona un perfil</option>
                            <option th:each="rol : ${rolesPerfilDisponibles}" th:value="${rol}"
                                    th:text="${rol}" th:selected="${perfil.rol == rol.name()}"></option>
                        </select>
                    </label>

                    <div class="campos-perfil rejilla" data-perfil="ESTUDIANTE" hidden>
                        <label>
                            Código estudiantil *
                            <input type="text" name="codigoEstudiantil" maxlength="30"
                                   th:value="${perfil.codigoEstudiantil}" data-required>
                        </label>
                        <label>
                            Semestre *
                            <input type="number" name="semestre" min="1" max="30"
                                   th:value="${perfil.semestre}" data-required>
                        </label>
                        <label>
                            Universidad *
                            <input type="text" name="universidad" maxlength="150"
                                   th:value="${perfil.universidad}" data-required>
                        </label>
                        <label>
                            Programa académico *
                            <input type="text" name="programaAcademico" maxlength="150"
                                   th:value="${perfil.programaAcademico}" data-required>
                        </label>
                    </div>

                    <div class="campos-perfil" data-perfil="TUTOR" hidden>
                        <label>
                            Materias *
                            <input type="text" name="materias" maxlength="500" th:value="${perfil.materias}"
                                   placeholder="Cálculo, Física, Programación" data-required>
                            <small>Separa varias materias con comas.</small>
                        </label>
                        <label>
                            Tarifa por hora *
                            <input type="number" name="tarifaPorHora" min="0.01" step="0.01"
                                   th:value="${perfil.tarifaPorHora}" data-required>
                        </label>
                        <label>
                            Biografía
                            <textarea name="biografia" maxlength="2000" rows="4"
                                      th:text="${perfil.biografia}"></textarea>
                        </label>
                    </div>
                </section>

                <div class="acciones-formulario">
                    <a class="boton boton-secundario" th:href="@{/usuarios}">Cancelar</a>
                    <button class="boton boton-primario" type="submit">Guardar</button>
                </div>
            </form>
        </section>
    </main>
    <script>
        const selectorRol = document.querySelector('#rol');
        const gruposPerfil = document.querySelectorAll('[data-perfil]');

        function actualizarPerfil() {
            gruposPerfil.forEach((grupo) => {
                const visible = grupo.dataset.perfil === selectorRol.value;
                grupo.hidden = !visible;
                grupo.querySelectorAll('input, textarea, select').forEach((campo) => {
                    campo.disabled = !visible;
                    campo.required = visible && campo.dataset.required !== undefined;
                });
            });
        }

        selectorRol.addEventListener('change', actualizarPerfil);
        actualizarPerfil();
    </script>
</body>
</html>
