<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - MyT</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <p class="marca">MyT</p>
                <h1>Clientes</h1>
                <p class="descripcion">Administra las cuentas sin eliminar su historial.</p>
            </div>
            <a class="boton boton-primario" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
        </header>

        <section class="tarjeta tabla-contenedor" aria-label="Listado de clientes">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Telefono</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="|${cliente.nombre} ${cliente.apellido}|"></td>
                        <td th:text="${cliente.correo}"></td>
                        <td th:text="${cliente.telefono ?: 'Sin registrar'}"></td>
                        <td>
                            <span class="estado"
                                  th:classappend="${cliente.activo} ? ' estado-activo' : ' estado-inactivo'"
                                  th:text="${cliente.activo} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="acciones">
                            <a class="enlace" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                            <form th:if="${cliente.activo}"
                                  th:action="@{/clientes/{id}/desactivar(id=${cliente.id})}" method="post">
                                <button class="enlace enlace-peligro" type="submit">Desactivar</button>
                            </form>
                            <form th:unless="${cliente.activo}"
                                  th:action="@{/clientes/{id}/activar(id=${cliente.id})}" method="post">
                                <button class="enlace" type="submit">Activar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td class="vacio" colspan="6">Aun no hay clientes. Crea el primero para comenzar.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
