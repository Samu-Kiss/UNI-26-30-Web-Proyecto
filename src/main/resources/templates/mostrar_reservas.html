<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor">
        <a class="volver" th:href="@{/admin(sesion=${sesion})}">Volver al menú</a>
        <header class="encabezado">
            <div>
                <p class="marca">MyT</p>
                <h1>Reservas</h1>
                <p class="descripcion">Consulta las sesiones registradas en la plataforma.</p>
            </div>
        </header>
            <div class="alerta-error" th:if="${error != null}">
                <p th:text="${error}"></p>
            </div>
        <section class="tarjeta tabla-contenedor" aria-label="Listado de reservas">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Estudiante</th><th>Tutor</th><th>Materia</th><th>Fecha</th>
                        <th>Hora</th><th>Duración</th><th>Tema</th><th>Modalidad</th><th>Estado</th><th>Costo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reserva : ${reservas}">
                        <td th:text="${reserva.id}"></td>
                        <td th:text="|${reserva.estudiante.usuario.nombre} ${reserva.estudiante.usuario.apellido}|"></td>
                        <td th:text="|${reserva.tutor.usuario.nombre} ${reserva.tutor.usuario.apellido}|"></td>
                        <td th:text="${reserva.materia.nombre}"></td>
                        <td th:text="${reserva.fecha}"></td>
                        <td th:text="${reserva.horaInicio}"></td>
                        <td th:text="|${reserva.duracionMinutos} min|"></td>
                        <td th:text="${reserva.tema}"></td>
                        <td><span class="etiqueta-neutral" th:text="${reserva.modalidad}"></span></td>
                        <td><span class="etiqueta-neutral" th:text="${reserva.estado}"></span></td>
                        <td th:text="${reserva.costoTotal}"></td>

                <td>
                     <div class="acciones-reserva">

                        <div class="acciones-principales">

                            <form th:if="${reserva.estado.name() == 'PENDIENTE'}"
                                th:action="@{/reservas}"
                                method="post">

                                <input type="hidden" name="id" th:value="${reserva.id}">
                            <input type="hidden" name="estado" value="CONFIRMADA">
                            <input type="hidden" name="sesion" th:value="${sesion}">

                            <button type="submit" class="boton boton-primario">
                                Confirmar
                            </button>
                        </form>

                        <button type="button"
                                class="boton boton-cancelar"
                                th:if="${reserva.estado.name() == 'PENDIENTE'
                                    or reserva.estado.name() == 'CONFIRMADA'
                                    or reserva.estado.name() == 'EN_CURSO'}"
                                th:onclick="|mostrarCancelacion(${reserva.id})|">
                            Cancelar
                    </button>

            </div>

            <form th:if="${reserva.estado.name() == 'PENDIENTE' or reserva.estado.name() == 'CONFIRMADA' or reserva.estado.name() == 'EN_CURSO'}"
                class="form-cancelacion"
                th:id="|cancelacion-${reserva.id}|"
                th:action="@{/reservas}"
                method="post"
                style="display: none;">

            <input type="hidden" name="id" th:value="${reserva.id}">
            <input type="hidden" name="estado" th:value="${reserva.estado.name() == 'PENDIENTE' ? 'RECHAZADA' : 'CANCELADA'}">
            <input type="hidden" name="sesion" th:value="${sesion}">

            <label class="sr-only"
                   for="motivo"
                   th:for="|motivo-${reserva.id}|">
                Motivo de cancelación
            </label>

            <input id="motivo"
                   class="campo-motivo"
                   type="text"
                   name="motivo"
                   th:id="|motivo-${reserva.id}|"
                   placeholder="Motivo de cancelación"
                   maxlength="500">

            <button type="button"
                    class="boton boton-cerrar"
                    th:onclick="|cerrarCancelacion(${reserva.id})|">
                X
            </button>

            <button type="submit" class="boton boton-cancelar">
                Enviar cancelación
            </button>

        </form>

        <span th:if="${reserva.estado.name() == 'CANCELADA'
                or reserva.estado.name() == 'COMPLETADA'
                or reserva.estado.name() == 'RECHAZADA'}">
            Sin acciones disponibles
        </span>

    </div>
</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reservas)}">
                        <td class="vacio" colspan="12">No hay reservas registradas.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script>
            function mostrarCancelacion(reservaId) {
            const formulario = document.getElementById(
                    "cancelacion-" + reservaId
            );

            formulario.style.display = "flex";
            }

            function cerrarCancelacion(reservaId) {
            const formulario = document.getElementById(
                "cancelacion-" + reservaId
            );

            const motivo = document.getElementById(
                "motivo-" + reservaId
            );

            motivo.value = "";
            formulario.style.display = "none";
        }
    </script>
</body>
</html>
