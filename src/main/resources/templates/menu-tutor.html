<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de tutor - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <p class="marca">MyT</p>
                <h1 th:text="|Hola, ${nombreSesion}|">Inicio de tutor</h1>
                <p class="descripcion">Consulta las tutorías asignadas a tu perfil.</p>
            </div>
        </header>
        <nav class="rejilla-menu" aria-label="Opciones de tutor">
            <a class="tarjeta opcion-menu"
               th:href="@{/tutores/{id}/reservas(id=${perfilIdSesion},sesion=${sesion})}">
                Mis reservas
                <small>Revisa fechas, estudiantes y temas de tus sesiones.</small>
            </a>
        </nav>
    </main>
</body>
</html>
