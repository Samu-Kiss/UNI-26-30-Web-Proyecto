<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes - MyT</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <p class="marca">MyT</p>
                <h1>Estudiantes</h1>
            </div>
        </header>
        <section class="tarjeta tabla-contenedor" aria-label="Listado de estudiantes">
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Codigo</th><th>Universidad</th><th>Programa</th><th>Semestre</th></tr>
                </thead>
                <tbody>
                    <tr th:each="estudiante : ${estudiantes}">
                        <td th:text="${estudiante.id}"></td>
                        <td th:text="|${estudiante.cliente.nombre} ${estudiante.cliente.apellido}|"></td>
                        <td th:text="${estudiante.codigoEstudiantil}"></td>
                        <td th:text="${estudiante.universidad}"></td>
                        <td th:text="${estudiante.programaAcademico}"></td>
                        <td th:text="${estudiante.semestre}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(estudiantes)}">
                        <td class="vacio" colspan="6">No hay estudiantes registrados.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
