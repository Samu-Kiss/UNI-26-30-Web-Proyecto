<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acciones de Reserva - MyT</title>
</head>
<body>
    <div th:fragment="acciones(actionUrl)" class="acciones-reserva">
        <div class="acciones-principales">
            <form th:if="${reserva.estado.name() == 'PENDIENTE'}"
                  th:action="${actionUrl}"
                  method="post">
                <input type="hidden" name="id" th:value="${reserva.id}">
                <input type="hidden" name="estado" value="CONFIRMADA">
                <input type="hidden" name="sesion" th:value="${sesion}">
                <button type="submit" class="boton boton-primario">
                    Confirmar
                </button>
            </form>

            <button type="button"
                    class="boton boton-cancelar"
                    th:if="${reserva.estado.name() == 'PENDIENTE'
                        or reserva.estado.name() == 'CONFIRMADA'
                        or reserva.estado.name() == 'EN_CURSO'}"
                    th:onclick="|mostrarCancelacion(${reserva.id})|">
                Cancelar
            </button>
        </div>

        <form th:if="${reserva.estado.name() == 'PENDIENTE' or reserva.estado.name() == 'CONFIRMADA' or reserva.estado.name() == 'EN_CURSO'}"
              class="form-cancelacion"
              th:id="|cancelacion-${reserva.id}|"
              th:action="${actionUrl}"
              method="post"
              style="display: none;">
            <input type="hidden" name="id" th:value="${reserva.id}">
            <input type="hidden" name="estado" th:value="${reserva.estado.name() == 'PENDIENTE' ? 'RECHAZADA' : 'CANCELADA'}">
            <input type="hidden" name="sesion" th:value="${sesion}">
            <label class="sr-only" for="motivo" th:for="|motivo-${reserva.id}|">Motivo de cancelación</label>
            <input id="motivo"
                   class="campo-motivo"
                   type="text"
                   name="motivo"
                   th:id="|motivo-${reserva.id}|"
                   placeholder="Motivo de cancelación"
                   maxlength="500">
            <button type="button" class="boton boton-cerrar" th:onclick="|cerrarCancelacion(${reserva.id})|">X</button>
            <button type="submit" class="boton boton-cancelar">Enviar cancelación</button>
        </form>

        <span th:if="${reserva.estado.name() == 'CANCELADA'
                or reserva.estado.name() == 'COMPLETADA'
                or reserva.estado.name() == 'RECHAZADA'}">
            Sin acciones disponibles
        </span>
    </div>

    <script th:fragment="script">
        function mostrarCancelacion(reservaId) {
            const formulario = document.getElementById("cancelacion-" + reservaId);
            if (formulario) formulario.style.display = "flex";
        }

        function cerrarCancelacion(reservaId) {
            const formulario = document.getElementById("cancelacion-" + reservaId);
            const motivo = document.getElementById("motivo-" + reservaId);
            if (motivo) motivo.value = "";
            if (formulario) formulario.style.display = "none";
        }
    </script>
</body>
</html>
