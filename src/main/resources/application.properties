spring.application.name=MyT

# PostgreSQL runtime configuration. For Supabase, use the JDBC URL from the
# Session pooler (port 5432) or a direct connection; keep credentials outside Git.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/myt?user=postgres&password=postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# Sentry remains disabled when SENTRY_DSN is absent. Keep local development noise-free.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.release=${SENTRY_RELEASE:myt@dev}
sentry.send-default-pii=false
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.logging.minimum-breadcrumb-level=info
sentry.logging.minimum-event-level=error
