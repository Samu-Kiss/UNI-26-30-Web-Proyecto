<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor">
        <a class="volver" th:href="${rutaMenu + '?sesion=' + sesion}">Volver al menú</a>
        <header class="encabezado">
            <div>
                <p class="marca">MyT</p>
                <h1>Tutores</h1>
                <p class="descripcion">Consulta materias, tarifas, calificaciones y disponibilidad.</p>
            </div>
        </header>
        <section class="tarjeta tabla-contenedor" aria-label="Listado de tutores">
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Materias</th><th>Tarifa por hora</th><th>Calificación</th><th>Disponibilidad</th><th>Acción</th></tr>
                </thead>
                <tbody>
                    <tr th:each="tutor : ${tutores}">
                        <td th:text="${tutor.id}"></td>
                        <td th:text="|${tutor.usuario.nombre} ${tutor.usuario.apellido}|"></td>
                        <td th:text="${#strings.listJoin(tutor.materias.![nombre], ', ')}"></td>
                        <td th:text="${tutor.tarifaPorHora}"></td>
                        <td th:text="${calificaciones.get(tutor.id)}"></td>
                        <td><span class="estado"
                                  th:classappend="${tutor.disponible ? 'estado-activo' : 'estado-inactivo'}"
                                  th:text="${tutor.disponible ? 'Disponible' : 'No disponible'}"></span></td>

                        <td class="acciones">
                            <a class="enlace" th:if="${tutor.disponible}" th:href="@{/tutores/{id}/reservar(id=${tutor.id},sesion=${sesion})}">
                                Reservar
                            </a>

                            <span th:unless="${tutor.disponible}">
                                No disponible
                            </span>
                        </td>

                    </tr>
                    <tr th:if="${#lists.isEmpty(tutores)}">
                        <td class="vacio" colspan="7">No hay tutores registrados.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
