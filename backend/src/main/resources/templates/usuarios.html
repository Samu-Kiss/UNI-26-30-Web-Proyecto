<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor">
        <a class="volver" th:href="@{/admin(sesion=${sesion})}">Volver al menú</a>
        <header class="encabezado">
            <div><p class="marca">MyT</p><h1>Usuarios</h1>
                <p class="descripcion">Identidad común para estudiantes, tutores y administradores.</p></div>
            <a class="boton boton-primario"
               th:href="@{/usuarios/nuevo(sesion=${sesion})}">Nuevo usuario</a>
        </header>
        <section class="tarjeta tabla-contenedor" aria-label="Listado de usuarios">
            <table>
                <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Roles</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="|${usuario.nombre} ${usuario.apellido}|"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td><div class="lista-etiquetas">
                            <span class="etiqueta-rol" th:each="rol : ${usuario.roles}" th:text="${rol}"></span>
                        </div></td>
                        <td><span class="estado" th:classappend="${usuario.activo ? 'estado-activo' : 'estado-inactivo'}"
                                  th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span></td>
                        <td class="acciones">
                            <a class="enlace" th:if="${puedeAgregarPerfil[usuario.id]}"
                               th:href="@{/usuarios/{id}/perfil/nuevo(id=${usuario.id},sesion=${sesion})}">Agregar perfil</a>
                            <a class="enlace"
                               th:href="@{/usuarios/{id}/editar(id=${usuario.id},sesion=${sesion})}">Editar</a>
                            <form th:if="${usuario.activo}"
                                  th:action="@{/usuarios/{id}/desactivar(id=${usuario.id},sesion=${sesion})}"
                                  method="post">
                                <button class="enlace enlace-peligro" type="submit">Desactivar</button>
                            </form>
                            <form th:unless="${usuario.activo}"
                                  th:action="@{/usuarios/{id}/activar(id=${usuario.id},sesion=${sesion})}"
                                  method="post">
                                <button class="enlace" type="submit">Activar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}"><td class="vacio" colspan="6">No hay usuarios registrados.</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
