<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario - MyT</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <main class="contenedor contenedor-formulario">
        <a class="volver" th:href="@{/admin(sesion=${sesion})}">Volver al menú</a>
        <a class="volver" th:href="@{/usuarios(sesion=${sesion})}">Volver a clientes</a>
        <section class="tarjeta formulario-tarjeta">
            <p class="marca">MyT</p>
            <h1>Editar usuario</h1>
            <p class="descripcion">Actualiza los datos de la cuenta. Sus perfiles se administran por separado.</p>
            <form class="formulario"
                  th:action="@{/usuarios/{id}/editar(id=${usuario.id},sesion=${sesion})}"
                  th:object="${usuario}" method="post">
                <div class="alerta-error" role="alert" th:if="${#fields.hasGlobalErrors()}"
                     th:each="error : ${#fields.globalErrors()}"
                     th:text="${error}"></div>
                <div class="rejilla">
                    <label>
                        Nombre *
                        <input type="text" th:field="*{nombre}" maxlength="100" required>
                        <span class="error" th:errors="*{nombre}"></span>
                    </label>
                    <label>
                        Apellido *
                        <input type="text" th:field="*{apellido}" maxlength="100" required>
                        <span class="error" th:errors="*{apellido}"></span>
                    </label>
                </div>
                <label>
                    Correo *
                    <input type="email" th:field="*{correo}" maxlength="120" required>
                    <span class="error" th:errors="*{correo}"></span>
                </label>
                <label>
                    Nueva contraseña
                    <input type="password" th:field="*{contrasena}" maxlength="72"
                           autocomplete="new-password">
                    <small>Déjala vacía para conservar la contraseña actual.</small>
                    <span class="error" th:errors="*{contrasena}"></span>
                </label>
                <label>
                    Teléfono
                    <input type="tel" th:field="*{telefono}" maxlength="30">
                </label>
                <fieldset class="panel-informativo">
                    <legend>Perfiles de acceso</legend>
                    <div class="lista-etiquetas">
                        <span th:each="rol : *{roles}" class="etiqueta-rol" th:text="${rol}"></span>
                    </div>
                    <p class="ayuda">Para añadir un perfil usa la acción «Agregar perfil» en el listado.</p>
                </fieldset>
                <div class="acciones-formulario">
                    <a class="boton boton-secundario"
                       th:href="@{/usuarios(sesion=${sesion})}">Cancelar</a>
                    <button class="boton boton-primario" type="submit">Guardar cambios</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
