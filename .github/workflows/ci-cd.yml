name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_sentry:
        description: Send one intentional backend exception to Sentry
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Lint, test and package
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify Sentry event delivery
        if: github.event_name == 'workflow_dispatch' && inputs.verify_sentry
        env:
          SENTRY_VERIFY: "true"
          SENTRY_DSN: >-
            https://c4030b0cfb10c760b3b1534427dd5c6c@o4511549920116736.ingest.us.sentry.io/4512006192693248
          SENTRY_ENVIRONMENT: ci
          SENTRY_RELEASE: myt@${{ github.sha }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=SentryVerificationTest test
          echo "Intentional Sentry verification event sent." >> "$GITHUB_STEP_SUMMARY"

      - name: Add test and coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import glob
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          test_totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          report_paths = [
              *glob.glob("target/surefire-reports/TEST-*.xml"),
              *glob.glob("target/failsafe-reports/TEST-*.xml"),
          ]

          for report_path in report_paths:
              suite = ET.parse(report_path).getroot()
              for key in test_totals:
                  test_totals[key] += int(suite.attrib.get(key, 0))

          passed = (
              test_totals["tests"]
              - test_totals["failures"]
              - test_totals["errors"]
              - test_totals["skipped"]
          )

          coverage = {
              "LINE_MISSED": 0,
              "LINE_COVERED": 0,
              "BRANCH_MISSED": 0,
              "BRANCH_COVERED": 0,
          }
          coverage_path = Path("target/site/jacoco/jacoco.csv")
          if coverage_path.exists():
              with coverage_path.open(newline="", encoding="utf-8") as report:
                  for row in csv.DictReader(report):
                      for key in coverage:
                          coverage[key] += int(row[key])

          def percentage(covered, missed):
              total = covered + missed
              return f"{covered / total:.1%}" if total else "N/A"

          lines = [
              "## Backend quality",
              "",
              "### Tests",
              "",
              "| Total | Passed | Failed | Errors | Skipped |",
              "| ---: | ---: | ---: | ---: | ---: |",
              (
                  f"| {test_totals['tests']} | {passed} | "
                  f"{test_totals['failures']} | {test_totals['errors']} | "
                  f"{test_totals['skipped']} |"
              ),
              "",
              "### JaCoCo coverage",
              "",
              "| Metric | Coverage | Covered | Missed |",
              "| --- | ---: | ---: | ---: |",
              (
                  f"| Lines | {percentage(coverage['LINE_COVERED'], coverage['LINE_MISSED'])} "
                  f"| {coverage['LINE_COVERED']} | {coverage['LINE_MISSED']} |"
              ),
              (
                  f"| Branches | {percentage(coverage['BRANCH_COVERED'], coverage['BRANCH_MISSED'])} "
                  f"| {coverage['BRANCH_COVERED']} | {coverage['BRANCH_MISSED']} |"
              ),
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Analyze with Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "Sonar skipped: configure SONAR_TOKEN and SONAR_PROJECT_KEY to enable it." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SONAR_HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
          sonar_args=(
            --batch-mode
            --no-transfer-progress
            sonar:sonar
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
          )

          if [[ -n "$SONAR_ORGANIZATION" ]]; then
            sonar_args+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi

          ./mvnw "${sonar_args[@]}"

      - name: Upload backend source context to Sentry
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "Sentry source-context upload skipped: configure SENTRY_AUTH_TOKEN." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ./mvnw --batch-mode --no-transfer-progress \
            -Psentry-source-context sentry:uploadSourceBundle
          echo "Sentry backend source context uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: myt-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend / Angular-ready
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Angular workspace
        id: angular
        shell: bash
        run: |
          if [[ -f frontend/angular.json && -f frontend/package-lock.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "directory=frontend" >> "$GITHUB_OUTPUT"
            echo "lockfile=frontend/package-lock.json" >> "$GITHUB_OUTPUT"
          elif [[ -f angular.json && -f package-lock.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "directory=." >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Angular workspace not present; frontend checks skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.angular.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ steps.angular.outputs.lockfile }}

      - name: Install dependencies
        if: steps.angular.outputs.enabled == 'true'
        working-directory: ${{ steps.angular.outputs.directory }}
        run: npm ci

      - name: Lint
        if: steps.angular.outputs.enabled == 'true'
        working-directory: ${{ steps.angular.outputs.directory }}
        run: npm run lint

      - name: Test
        if: steps.angular.outputs.enabled == 'true'
        working-directory: ${{ steps.angular.outputs.directory }}
        run: npm run test:ci

      - name: Build
        if: steps.angular.outputs.enabled == 'true'
        working-directory: ${{ steps.angular.outputs.directory }}
        env:
          SENTRY_RELEASE: myt-frontend@${{ github.sha }}
        run: npm run build

      - name: Upload Angular source maps to Sentry
        if: >-
          steps.angular.outputs.enabled == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        working-directory: ${{ steps.angular.outputs.directory }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_FRONTEND_PROJECT }}
          SENTRY_RELEASE: myt-frontend@${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
            echo "Sentry source-map upload skipped: configuration is incomplete." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run sentry:sourcemaps

  container:
    name: Container / build and publish
    needs: [backend, frontend]
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: >-
            ${{ github.event_name == 'pull_request' ||
            github.event_name == 'workflow_dispatch' }}
          push: >-
            ${{ github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container startup
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          container_id="$(docker run --detach --env SENTRY_DSN= "$image_tag")"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in {1..30}; do
            if docker logs "$container_id" 2>&1 | grep -q "Started MyTApplication"; then
              echo "Container started successfully with the Sentry Java agent." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          echo "Container did not become ready within 30 seconds." >&2
          exit 1
