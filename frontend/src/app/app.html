<app-tutores-page />

@if (sentryTestEnabled) {
  <aside class="sentry-test" aria-label="Verificación de Sentry">
    <strong>Diagnóstico de observabilidad</strong>
    <span>Genera un error intencional para comprobar Sentry.</span>
    <app-button variant="danger" size="md" (clicked)="throwTestError()">Probar error de Sentry</app-button>
    @if (sentryEventId(); as eventId) {
      <output>Evento enviado: {{ eventId }}</output>
    }
  </aside>
}
