<div class="identidad">
  <app-avatar [name]="tutor().nombreCompleto" size="md" />
  <div>
    <strong>{{ tutor().nombreCompleto }}</strong>
    <div class="materias" aria-label="Materias">
      @for (materia of tutor().materias; track materia) {
        <app-badge variant="neutral">{{ materia }}</app-badge>
      }
    </div>
  </div>
</div>
