<div class="identidad">
  <span class="avatar" aria-hidden="true">{{ initials(tutor().nombreCompleto) }}</span>
  <div>
    <strong>{{ tutor().nombreCompleto }}</strong>
    <div class="materias" aria-label="Materias">
      @for (materia of tutor().materias; track materia) {
        <span>{{ materia }}</span>
      }
    </div>
  </div>
</div>
