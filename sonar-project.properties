sonar.projectKey=Samu-Kiss_UNI-26-30-Web-Proyecto
sonar.organization=samu-kiss

# Source and Test directories
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.spec.ts

# Exclusions
# Exclude build output, coverage reports, assets, and PostgreSQL migrations/seeds
# (PostgreSQL DDL/DML triggers false positives in Sonar's Oracle PL/SQL sensor)
sonar.exclusions=\
  **/coverage/**,\
  **/dist/**,\
  **/target/**,\
  **/node_modules/**,\
  backend/src/main/resources/**,\
  frontend/public/**,\
  backend/supabase/**,\
  **/*.sql

# Unbind .sql extension from Oracle PL/SQL plugin
sonar.plsql.file.suffixes=pks,pkb

sonar.coverage.exclusions=\
  frontend/src/main.ts,\
  frontend/src/app/app.config.ts,\
  frontend/src/app/app.routes.ts,\
  backend/src/main/java/com/typeerror/myt/MyTApplication.java

# Java & Coverage
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
